name: test

on:
  push:
  pull_request:

jobs:
  forge:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: forge test
        working-directory: contracts
        run: forge test

  node:
    name: node unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Metadata
        run: pnpm --filter @proofchain/metadata test
      - name: Pin
        run: pnpm --filter @proofchain/pin test
      - name: Indexer
        run: pnpm --filter @proofchain/indexer test
      - name: Web
        run: pnpm --filter @proofchain/web test

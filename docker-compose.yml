name: proofchain

# Local stack. Published ports stay on 127.0.0.1. Each *_HOST_PORT variable moves one host port.
# Anvil, Kubo, pin, and the indexers listen on 0.0.0.0 inside the container
# because 127.0.0.1 there is the container itself, not the laptop.

x-indexer-build: &indexer-build
  context: .
  dockerfile: docker/indexer.Dockerfile

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.6
    # The image entrypoint is /bin/sh -c, which would drop these flags.
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:${ANVIL_HOST_PORT:-8545}:8545"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofchain}
      POSTGRES_DB: ${POSTGRES_DB:-proofchain}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the data volume is empty.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ipfs:
    image: ipfs/kubo:v0.43.1
    ports:
      - "127.0.0.1:${IPFS_API_HOST_PORT:-5001}:5001"
      - "127.0.0.1:${IPFS_GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - ipfs_data:/data/ipfs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ipfs", "--api", "/ip4/127.0.0.1/tcp/5001", "id"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  pin:
    build:
      context: .
      dockerfile: docker/pin.Dockerfile
    init: true
    environment:
      PIN_HOST: "0.0.0.0"
      PORT: "8788"
      IPFS_API_URL: http://ipfs:5001
      PINATA_JWT: ${PINATA_JWT:-}
      PIN_REQUIRE_PUBLIC: ${PIN_REQUIRE_PUBLIC:-}
      PINATA_API_URL: ${PINATA_API_URL:-}
    ports:
      - "127.0.0.1:${PIN_HOST_PORT:-8788}:8788"
    restart: unless-stopped
    depends_on:
      ipfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8788/metadata").then(() => process.exit(0)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    build: *indexer-build
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proofchain}:${POSTGRES_PASSWORD:-proofchain}@postgres:5432/${POSTGRES_DB:-proofchain}
      CHAIN_RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      # The first contract account 0 deploys on a fresh Anvil.
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      START_BLOCK: ${START_BLOCK:-0}
      CONFIRMATIONS: "0"
      IPFS_API_URL: http://ipfs:5001
      INDEXER_HOST: "0.0.0.0"
      INDEXER_PORT: "8787"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PIN_URL: http://pin:8788
      POLL_INTERVAL_MS: "2000"
    ports:
      - "127.0.0.1:${INDEXER_HOST_PORT:-8787}:8787"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8787/health").then((response) => response.json()).then((health) => process.exit(health.syncOk ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  indexer-sepolia:
    build: *indexer-build
    profiles: ["sepolia"]
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proofchain}:${POSTGRES_PASSWORD:-proofchain}@postgres:5432/proofchain_sepolia
      CHAIN_RPC_URL: ${SEPOLIA_CHAIN_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      CHAIN_ID: "11155111"
      # The version 2 Sepolia deployment and its block. The indexer refuses to start while either is empty.
      CONTRACT_ADDRESS: ${SEPOLIA_CONTRACT_ADDRESS:-}
      START_BLOCK: ${SEPOLIA_START_BLOCK:-}
      CONFIRMATIONS: "2"
      IPFS_API_URL: http://ipfs:5001
      INDEXER_HOST: "0.0.0.0"
      INDEXER_PORT: "8789"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PIN_URL: http://pin:8788
      POLL_INTERVAL_MS: "2000"
    ports:
      - "127.0.0.1:${INDEXER_SEPOLIA_HOST_PORT:-8789}:8789"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8789/health").then((response) => response.json()).then((health) => process.exit(health.syncOk ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  ipfs_data:
